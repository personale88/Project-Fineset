name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci --ignore-scripts

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
        env:
          SKIP_ENV_VALIDATION: true
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_SECRET: ci-build-auth-secret-not-for-production
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fineset
          POSTGRES_PASSWORD: fineset
          POSTGRES_DB: fineset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fineset"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci --ignore-scripts

      - run: npx prisma generate

      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://fineset:fineset@localhost:5432/fineset_test?schema=public
          DIRECT_URL: postgresql://fineset:fineset@localhost:5432/fineset_test?schema=public

      - run: npm run test:integration
        # performance-services + performance-api self-seed via tests/fixtures/perf-seed.ts
        env:
          SKIP_ENV_VALIDATION: true
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_SECRET: ci-integration-auth-secret-not-for-production
          DEV_AUTH_BYPASS: "false"
          DATABASE_URL: postgresql://fineset:fineset@localhost:5432/fineset_test?schema=public
          DIRECT_URL: postgresql://fineset:fineset@localhost:5432/fineset_test?schema=public

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fineset
          POSTGRES_PASSWORD: fineset
          POSTGRES_DB: fineset_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fineset"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public
      DIRECT_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci --ignore-scripts

      - run: npx prisma generate

      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public
          DIRECT_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public

      - run: npm run db:seed
        env:
          SKIP_ENV_VALIDATION: true
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DATABASE_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public
          DIRECT_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public

      - run: npx playwright install chromium

      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_SECRET: ci-build-auth-secret-not-for-production
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - run: npm run test:e2e
        env:
          CI: true
          SKIP_ENV_VALIDATION: true
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_SECRET: ci-e2e-auth-secret-not-for-production
          DATABASE_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public
          DIRECT_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          MASTER_ADMIN_EMAIL: admin@fineset.local
          MASTER_ADMIN_PASSWORD: FineSet#1dev
      - run: npm run test:pwa
        env:
          CI: true
          SKIP_ENV_VALIDATION: true
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_SECRET: ci-e2e-auth-secret-not-for-production
          DATABASE_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public
          DIRECT_URL: postgresql://fineset:fineset@localhost:5432/fineset_e2e?schema=public
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_USER_EMAIL: admin@fineset.local
          E2E_USER_PASSWORD: FineSet#1dev
